<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="../Social-links-profile-soln/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <section class="container">
      <div class="inner_container">
        <div class="profile_container">
          <img
            src="../Social-links-profile-soln//Asset/Image/binyam.JPG"
            alt="binyam"
          />
          <h2>Binyam Yirmed</h2>

          <p>Addis Ababa, Ethiopia</p>
        </div>

        <p>"Front-end developer and avid reader."</p>

        <div class="links_container">
          <ul>
            <li><a href="http://github.com">GitHub</a></li>
            <li>
              <a href="https://www.frontendmentor.io/home">Frontend Mentor</a>
            </li>
            <li><a href="https://www.linkedin.com/feed/">LinkedIn</a></li>
            <li><a href="https://www.twitter.com">Twitter</a></li>
            <li><a href="https://www.instagram.com">Instagram</a></li>
          </ul>
        </div>

        <div class="attribution">
          Challenge by
          <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
            >Frontend Mentor</a
          >. Coded by <a href="#">Binyam</a>.
        </div>
      </div>
    </section>
  </body>
</html>
